<!DOCTYPE html>
<html lang="en" style="background-color: #0e1017; color: #f2f4f8; margin: 0; padding: 0; min-height: 100vh; height: 100%;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linear Ticket Creator</title>
  <style>
    /* Critical inline styles to guarantee the panel is dark and never shows a stark white blank frame */
    html, body {
      background-color: #0e1017 !important;
      color: #f2f4f8 !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #root {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #0e1017;
    }

    /* Instant zero-delay pre-mount loader */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.8; }
    }
    .pre-mount-loader {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      background-color: #0e1017;
      box-sizing: border-box;
    }
    .pre-mount-header {
      height: 48px;
      background-color: #161822;
      border-bottom: 1px solid #272a3b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-sizing: border-box;
    }
    .pre-mount-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #f2f4f8;
      letter-spacing: -0.2px;
    }
    .pre-mount-badge {
      width: 36px;
      height: 18px;
      border-radius: 9px;
      background-color: #1e2130;
      animation: pulse 1.6s ease-in-out infinite;
    }
    .pre-mount-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      gap: 14px;
      box-sizing: border-box;
    }
    .pre-mount-spinner-ring {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(94, 106, 210, 0.18);
      border-top-color: #5e6ad2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .pre-mount-title {
      font-size: 13px;
      font-weight: 600;
      color: #f2f4f8;
      margin-top: 4px;
    }
    .pre-mount-subtitle {
      font-size: 11px;
      color: #8b90a4;
      animation: pulse 1.6s ease-in-out infinite;
    }
    .pre-mount-skeleton-card {
      width: 100%;
      max-width: 260px;
      height: 64px;
      border-radius: 6px;
      background-color: #161822;
      border: 1px solid #272a3b;
      margin-top: 8px;
      animation: pulse 1.6s ease-in-out infinite;
    }
  </style>
  <link rel="stylesheet" href="./popup.css">
</head>
<body style="background-color: #0e1017; color: #f2f4f8; margin: 0; padding: 0; min-height: 100vh; height: 100%;">
  <div id="root">
    <div class="pre-mount-loader">
      <div class="pre-mount-header">
        <div class="pre-mount-brand">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5e6ad2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2" />
            <path d="m9 12 2 2 4-4" />
          </svg>
          <span>Linear Creator</span>
        </div>
        <div class="pre-mount-badge"></div>
      </div>
      <div class="pre-mount-body">
        <div class="pre-mount-spinner-ring"></div>
        <div class="pre-mount-title">Loading Linear Creator...</div>
        <div class="pre-mount-subtitle">Preparing workspace & page context</div>
        <div class="pre-mount-skeleton-card"></div>
      </div>
    </div>
  </div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
