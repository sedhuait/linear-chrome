<!DOCTYPE html>
<html lang="en" style="background-color: #0e1017; color: #f2f4f8; margin: 0; padding: 0; min-height: 100vh; height: 100%;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linear Ticket Creator</title>
  <style>
    /* Critical inline styles to guarantee the panel is dark and never shows a stark white blank frame */
    html, body {
      background-color: #0e1017 !important;
      color: #f2f4f8 !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #root {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #0e1017;
    }
  </style>
  <link rel="stylesheet" href="./popup.css">
</head>
<body style="background-color: #0e1017; color: #f2f4f8; margin: 0; padding: 0; min-height: 100vh; height: 100%;">
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
