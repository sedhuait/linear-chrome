  <!-- Center Focus Dot -->
  <circle cx="64" cy="64" r="14" fill="#FFFFFF"/>
  <!-- Crosshair Marks -->
  <line x1="64" y1="20" x2="64" y2="30" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="64" y1="98" x2="64" y2="108" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="20" y1="64" x2="30" y2="64" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="98" y1="64" x2="108" y2="64" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- Status Badge Light -->
  <circle cx="94" cy="34" r="7" fill="#38EF7D"/>
</svg>
