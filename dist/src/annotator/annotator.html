<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annotate Screenshot - Linear Chrome</title>
  <script type="module" crossorigin src="/assets/annotator-AsFpBKsS.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-DaKOjhqt.js">
  <link rel="stylesheet" crossorigin href="/assets/annotator-D-n2rU1r.css">
</head>
<body>
  <div class="annotator-app">
    <!-- Top Header Bar -->
    <header class="annotator-header">
      <div class="header-left">
        <div class="brand">
          <svg class="brand-icon" viewBox="0 0 128 128" width="22" height="22">
            <rect x="8" y="8" width="112" height="112" rx="28" fill="#5E6AD2"/>
            <circle cx="64" cy="64" r="32" stroke="#FFFFFF" stroke-width="6" fill="none"/>
            <circle cx="64" cy="64" r="14" fill="#FFFFFF"/>
            <circle cx="94" cy="34" r="7" fill="#38EF7D"/>
          </svg>
          <span class="brand-title">Linear Screenshot Annotator</span>
        </div>
      </div>

      <!-- Main Tools Palette -->
      <div class="toolbar">
        <button id="tool-box" class="tool-btn active" title="Bounding Box (B)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          </svg>
          <span>Box</span>
        </button>

        <button id="tool-arrow" class="tool-btn" title="Pointer Arrow (A)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
          <span>Arrow</span>
        </button>

        <button id="tool-pen" class="tool-btn" title="Freehand Pen (P)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
          </svg>
          <span>Pen</span>
        </button>

        <button id="tool-blur" class="tool-btn" title="Blur / Redact Sensitive Data (R)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
          </svg>
          <span>Redact</span>
        </button>

        <button id="tool-text" class="tool-btn" title="Text Label (T)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="4 7 4 4 20 4 20 7"></polyline>
            <line x1="9" y1="20" x2="15" y2="20"></line>
            <line x1="12" y1="4" x2="12" y2="20"></line>
          </svg>
          <span>Text</span>
        </button>

        <div class="divider"></div>

        <!-- Color Selector -->
        <div class="color-picker-group">
          <button class="color-dot active" data-color="#EB5757" style="background: #EB5757;" title="Red (Bug)"></button>
          <button class="color-dot" data-color="#F2994A" style="background: #F2994A;" title="Orange"></button>
          <button class="color-dot" data-color="#5E6AD2" style="background: #5E6AD2;" title="Linear Indigo"></button>
          <button class="color-dot" data-color="#27AE60" style="background: #27AE60;" title="Green"></button>
          <button class="color-dot" data-color="#FFFFFF" style="background: #FFFFFF;" title="White"></button>
        </div>

        <div class="divider"></div>

        <!-- History actions -->
        <button id="btn-undo" class="action-btn" title="Undo (Cmd+Z)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 7v6h6"></path>
            <path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"></path>
          </svg>
        </button>

        <button id="btn-clear" class="action-btn" title="Clear Annotations">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>

      <!-- Action right -->
      <div class="header-right">
        <button id="btn-cancel" class="btn btn-secondary">Discard</button>
        <button id="btn-save" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Save & Use
        </button>
      </div>
    </header>

    <!-- Canvas Workspace Area -->
    <main class="canvas-workspace">
      <div class="canvas-container" id="canvas-container">
        <canvas id="paint-canvas"></canvas>
      </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>
  </div>

</body>
</html>
